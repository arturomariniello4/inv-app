<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="INV">
  <meta name="theme-color" content="#0f1720">
  <title>INV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --alert:#b45309; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1720; --card:#17212b; --text:#e5e7eb; --muted:#9ca3af; --line:#263241; --accent:#2dd4bf; --alert:#fbbf24; } }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text);
           padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 0 8px; }
    h1 { font-size:22px; margin:0; }
    .muted { color:var(--muted); font-size:13px; }
    button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:var(--accent); color:#fff; }
    button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
    .item { cursor:pointer; }
    .kind { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); }
    .kind.alert { color:var(--alert); }
    .title { font-weight:600; margin:2px 0; }
    #reader h1, #reader h2 { font-size:18px; margin:18px 0 6px; }
    #reader table { border-collapse:collapse; font-size:13px; width:100%; display:block; overflow-x:auto; }
    #reader td, #reader th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; }
    #reader a { color:var(--accent); word-break:break-all; }
    textarea { width:100%; height:120px; font:12px ui-monospace, monospace; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); }
    .hidden { display:none; }
    /* Evening briefing: newspaper layout */
    :root { --paper:#fbfbf8; --ink:#141c25; --ink2:#33404d; --np-accent:#1c4f86; --up:#1f7a45; --down:#b23b3b; }
    @media (prefers-color-scheme: dark) { :root { --paper:#151b22; --ink:#e8edf2; --ink2:#c3ccd5; --np-accent:#8fb6e6; --up:#5fc48a; --down:#ef7d7d; } }
    #reader.paper { background:var(--paper); color:var(--ink); padding:0; overflow:hidden; }
    .np { font-family: -apple-system, system-ui, sans-serif; padding-bottom:16px; }
    .np h2, .np h3, .np-name, .np-sub, .np-stand, .np-last { font-family: "New York", "Iowan Old Style", Georgia, serif; }
    #reader.paper ~ footer { display:none; }
    .np-mast { display:block; text-align:center; padding:12px 14px 8px; border-bottom:3px double var(--ink); }
    .np-mast-top { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
    .np-name { font-weight:700; font-size:40px; letter-spacing:.14em; line-height:1.05; }
    .np-sub { font-style:italic; font-size:14px; color:var(--muted); }
    .np-ticker { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); }
    .np-ticker div { flex:0 0 auto; display:grid; padding:6px 12px; border-right:1px solid var(--line); font-variant-numeric:tabular-nums; }
    .np-ticker span { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
    .np-ticker b { font:500 13px ui-monospace, monospace; } .np-ticker i { font:normal 11px ui-monospace, monospace; }
    .up { color:var(--up); } .down { color:var(--down); }
    .np-lead { padding:12px 14px 14px; border-bottom:1px solid var(--ink); display:grid; gap:8px; }
    .np-lead h2 { font-size:26px; line-height:1.12; margin:0; }
    .np-kicker { font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--np-accent); }
    .np-stand { font-size:16px; line-height:1.42; margin:0; color:var(--ink2); }
    .np-case { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:13px; padding:8px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .np-case b { font-size:10px; text-transform:uppercase; letter-spacing:.08em; padding-top:3px; }
    .np-by { font-size:11px; color:var(--muted); }
    #reader .np-by a { color:var(--np-accent); font-weight:600; text-decoration:none; word-break:normal; }
    .np-sec { padding:0 14px; margin-top:14px; }
    .np-sec h4 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.12em; border-top:2px solid var(--ink); padding-top:6px; }
    .np-item { display:grid; gap:4px; padding:10px 0; border-bottom:1px solid var(--line); }
    .np-item h3 { font-size:19px; line-height:1.2; margin:0; }
    #reader .np-lead h2, #reader .np-item h3 { margin:0; }
    .np-item .np-stand { font-size:15px; }
    .np-quiet { list-style:none; margin:0; padding:0; font-size:13px; color:var(--muted); }
    .np-quiet li { padding:6px 0; border-bottom:1px solid var(--line); } .np-quiet b { color:var(--ink); margin-right:4px; }
    .np-note, .np-pad { padding:0 14px; font-size:13px; color:var(--muted); }
    .np-last { margin:14px 14px 0; font-size:12px; font-style:italic; color:var(--muted); }
    footer { margin-top:24px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1 id="heading">INV</h1>
    <button id="back" class="secondary hidden">Back</button>
  </header>

  <section id="setup" class="card hidden">
    <div class="title">Turn on notifications</div>
    <p id="setup-text" class="muted"></p>
    <button id="subscribe">Allow notifications</button>
    <div id="sub-out" class="hidden">
      <p class="muted">Copy this and paste it into the repository secret <b>INV_PUSH_SUBSCRIPTIONS</b>, inside square brackets: [ ... ]</p>
      <textarea id="sub-json" readonly></textarea>
      <button id="copy" class="secondary">Copy</button>
    </div>
  </section>

  <main id="list"></main>
  <article id="reader" class="card hidden"></article>

  <footer class="muted">Information only. The app never trades: you decide and place every order.</footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
