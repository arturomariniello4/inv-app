<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="INV">
  <meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151b22" media="(prefers-color-scheme: dark)">
  <title>INV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png?v=2">
  <style>
    /* Front page of a personal newspaper: paper, ink, one navy accent. Serif for headlines, system sans for the rest. */
    :root { --paper:#fbfbf8; --card:#ffffff; --ink:#141c25; --ink2:#33404d; --muted:#5f6c79; --line:#dcdfe3;
            --accent:#1c4f86; --alert:#a8461b; --up:#1f7a45; --down:#b23b3b;
            --serif:"New York", "Iowan Old Style", Georgia, serif; --sans:-apple-system, system-ui, sans-serif; --mono:ui-monospace, "SF Mono", monospace; }
    @media (prefers-color-scheme: dark) { :root { --paper:#151b22; --card:#1b232c; --ink:#e8edf2; --ink2:#c3ccd5; --muted:#93a1af; --line:#2b3642;
            --accent:#8fb6e6; --alert:#f0a46e; --up:#5fc48a; --down:#ef7d7d; } }
    * { box-sizing:border-box; }
    html, body { background:var(--paper); }
    body { margin:0; font:16px/1.45 var(--sans); color:var(--ink); -webkit-text-size-adjust:100%;
           padding: env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); }
    a { color:var(--accent); }
    button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
    .hidden { display:none !important; }
    .wrap { padding:0 16px; }
    .muted { color:var(--muted); font-size:13px; }

    /* Masthead */
    .mast { text-align:center; padding:10px 16px 8px; border-bottom:3px double var(--ink); position:relative; }
    .mast-top { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); letter-spacing:.03em; }
    .mast-name { font:700 40px/1.05 var(--serif); letter-spacing:.14em; margin-top:2px; }
    .mast-sub { font:italic 14px var(--serif); color:var(--muted); }
    .bar { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; border-bottom:1px solid var(--line); }
    .bar h1 { font:700 24px var(--serif); margin:0; }
    .back { color:var(--accent); font-weight:600; font-size:15px; }

    /* Markets strip */
    .ticker { display:flex; overflow-x:auto; border-bottom:1px solid var(--line); scrollbar-width:none; }
    .ticker::-webkit-scrollbar { display:none; }
    .ticker div { flex:0 0 auto; display:grid; padding:7px 12px; border-right:1px solid var(--line); font-variant-numeric:tabular-nums; }
    .ticker span { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
    .ticker b { font:500 13px var(--mono); } .ticker i { font:normal 11px var(--mono); }
    .up { color:var(--up); } .down { color:var(--down); }

    /* Stories */
    .kicker { font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--accent); }
    .kicker.alert { color:var(--alert); }
    .lead { padding:12px 16px 14px; border-bottom:1px solid var(--ink); display:grid; gap:7px; }
    .lead h2 { font:700 27px/1.12 var(--serif); margin:0; }
    .stand { font:16px/1.42 var(--serif); margin:0; color:var(--ink2); }
    .case { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:13px; padding:8px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .case b { font-size:10px; text-transform:uppercase; letter-spacing:.08em; padding-top:3px; }
    .by { font-size:11px; color:var(--muted); }
    .by a { font-weight:600; text-decoration:none; }
    .sec { padding:0 16px; margin-top:16px; }
    .sec-h { display:flex; justify-content:space-between; align-items:baseline; border-top:2px solid var(--ink); padding-top:6px; }
    .sec-h h3 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
    .sec-h button, .sec-h a { font-size:12px; color:var(--accent); font-weight:600; text-decoration:none; }
    .item { display:grid; gap:4px; padding:10px 0; border-bottom:1px solid var(--line); }
    .item:last-child { border-bottom:0; }
    .item h4 { font:700 19px/1.2 var(--serif); margin:0; }
    .item .stand { font-size:15px; }
    .row { display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); text-align:left; width:100%; }
    .row .t { font:700 17px/1.25 var(--serif); }
    .row .chev { color:var(--muted); font-size:18px; }
    .quiet { list-style:none; margin:0; padding:0; font-size:13px; color:var(--muted); }
    .quiet li { padding:6px 0; border-bottom:1px solid var(--line); } .quiet b { color:var(--ink); margin-right:4px; }
    .note { font-size:13px; color:var(--muted); margin:12px 16px 0; }
    .last { margin:18px 16px 0; font:italic 12px var(--serif); color:var(--muted); }
    .empty { padding:28px 16px; text-align:center; }
    .empty h2 { font:700 22px var(--serif); margin:0 0 6px; }

    .doc { padding-top:8px; padding-bottom:8px; }
    .doc h2, .doc h3, .doc h4 { font-family:var(--serif); margin:16px 0 6px; } .doc p { margin:6px 0; }
    .doc table { border-collapse:collapse; font-size:13px; } .doc td { border-bottom:1px solid var(--line); padding:4px 6px; }

    /* Alert card */
    .acard { padding:12px 16px 4px; display:grid; gap:10px; }
    .acard h2 { font:700 25px/1.15 var(--serif); margin:0; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:4px;
           background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); }
    .tag.urg { background:color-mix(in srgb, var(--alert) 14%, transparent); color:var(--alert); }
    .blk { border-top:1px solid var(--line); padding-top:8px; }
    .blk h3 { margin:0 0 3px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .blk p { margin:0; } .blk ul { margin:2px 0 0; padding-left:18px; font-size:14px; }
    .blk.case { display:grid; grid-template-columns:auto 1fr; gap:5px 10px; font-size:14px; border-bottom:0; padding-bottom:0; }
    .conf { display:flex; gap:8px; align-items:baseline; } .dots { letter-spacing:2px; color:var(--alert); }
    .src { display:flex; justify-content:space-between; align-items:center; gap:10px; border-top:1px solid var(--line); padding-top:10px; font-size:13px; }
    .src .btn { margin:0; text-decoration:none; }
    .acard .last { margin:4px 0 0; }

    /* Settings */
    .group { margin:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .group h3 { margin:0; padding:10px 14px 6px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
    .kv { display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-top:1px solid var(--line); font-size:15px; }
    .kv span:last-child { color:var(--muted); text-align:right; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; padding:4px 14px 12px; }
    .chip { font-size:13px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); }
    .edit { display:block; padding:11px 14px; border-top:1px solid var(--line); font-weight:600; text-decoration:none; }
    .group p { margin:0; padding:4px 14px 12px; font-size:14px; color:var(--ink2); }
    .btn { display:inline-block; margin:4px 14px 12px; padding:9px 14px; border-radius:10px; background:var(--accent); color:var(--paper); font-weight:600; }
    textarea { width:calc(100% - 28px); margin:0 14px 8px; height:110px; font:12px var(--mono); border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); }
    .banner { margin:12px 16px 0; padding:10px 12px; border:1px solid var(--accent); border-radius:10px; font-size:14px; }
    .banner button { color:var(--accent); font-weight:600; }


    /* Ideas tab (ideas.js): Finviz-style fast list, score shape and checks, letter grades, value range, statements */
    :root { --upbg:#e5f4e4; --downbg:#fbebeb; --mid:#8a6d1c; --midbg:#f9eeda; --tint:#e7f1fb; }
    @media (prefers-color-scheme: dark) { :root { --upbg:#173226; --downbg:#3a1e20; --mid:#e3c26a; --midbg:#352d17; --tint:#1d2a38; } }
    .sub { margin:6px 16px 0; font-size:13px; color:var(--muted); }
    .lede { margin:10px 16px 0; font:15px/1.4 var(--serif); color:var(--ink2); }
    .pad { padding:12px 16px; } .fine { margin:6px 16px 0; font-size:12px; }
    .seg3 { display:grid; grid-template-columns:1fr 1.25fr .7fr; margin:10px 16px 0; background:var(--line); border-radius:9px; padding:2px; }
    .seg3 button { text-align:center; font-size:13px; font-weight:600; padding:6px 2px; border-radius:7px; color:var(--ink2); }
    .seg3 button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); }
    .seg3 i { font-style:normal; color:var(--muted); font-weight:500; }
    .card { margin:10px 16px 0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; display:grid; gap:8px; text-align:left; cursor:pointer; }
    .card .top { display:grid; grid-template-columns:64px 1fr; gap:12px; align-items:center; }
    .card h3 { font:700 18px/1.2 var(--serif); margin:2px 0; }
    .tk { font:600 12px var(--mono); color:var(--muted); }
    .rk { display:flex; gap:8px; align-items:baseline; font-size:12px; } .rk b { font:700 13px var(--mono); }
    .tag { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .tag.go { color:var(--up); } .tag.watch { color:var(--mid); } .tag.out { color:var(--muted); }
    .mv { font:600 11px var(--mono); color:var(--muted); } .mv.new { color:var(--accent); }
    .gap { margin:0; font-size:14px; color:var(--ink2); } .gap b { color:var(--down); }
    .meters { display:grid; gap:4px; }
    .meter { display:grid; grid-template-columns:62px 1fr 28px; gap:8px; align-items:center; font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
    .meter div { height:6px; border-radius:3px; background:var(--line); overflow:hidden; } .meter i { display:block; height:100%; }
    .meter .heat { background:var(--alert); } .meter .str { background:var(--accent); }
    .meter b { font:600 12px var(--mono); color:var(--ink); text-align:right; }
    ul.dr { list-style:none; margin:0; padding:0; font-size:13px; display:grid; gap:3px; }
    ul.dr li { display:grid; grid-template-columns:14px 1fr; gap:4px; } ul.dr a { color:var(--ink2); }
    ul.dr .p, .rr .up { color:var(--up); } ul.dr .n, .rr .down { color:var(--down); } ul.dr .o { color:var(--muted); }
    .radar text { font:600 10px var(--sans); fill:var(--muted); }
    .hero2 { display:grid; justify-items:center; gap:6px; padding:8px 16px 0; text-align:center; }
    .hero2 h2 { font:700 26px/1.1 var(--serif); margin:4px 0 2px; } .hero2 .rk { justify-content:center; }
    .grades { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin:12px 16px 0; }
    .grades div { text-align:center; border-radius:8px; padding:5px 0; display:grid; font-size:9px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--line); }
    .grades b { font:700 18px var(--sans); color:var(--ink); } .grades i { font:normal 10px var(--mono); }
    .gA { background:var(--upbg) !important; } .gA b, span.gA { color:var(--up); }
    .gB { background:var(--tint) !important; } .gB b, span.gB { color:var(--accent); }
    .gC { background:var(--midbg) !important; } .gC b, span.gC { color:var(--mid); }
    .gD b, .gE b, span.gD, span.gE { color:var(--down); }
    .note2 { margin:12px 16px 0; font:15px/1.4 var(--serif); color:var(--ink2); } .note2 b { color:var(--ink); }
    .hero2 + .grades + .note2 + .meters { margin:10px 16px 0; }
    .isec { margin:18px 16px 0; }
    .isec h4 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
    .isec h4 span { font-weight:500; text-transform:none; letter-spacing:0; color:var(--muted); font-size:12px; text-align:right; }
    .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 12px; }
    .box.flush { margin:12px 16px 0; padding:0 8px; overflow-x:auto; }
    .box p { margin:8px 0; font-size:14px; }
    .box .kv { padding:8px 0; border-top:0; border-bottom:1px solid var(--line); font-size:14px; }
    .box .kv:last-child { border-bottom:0; }
    .fast { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
    .fast th { text-align:right; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; padding:6px 3px; border-bottom:1px solid var(--line); white-space:nowrap; }
    .fast th button { font:inherit; color:inherit; text-transform:inherit; letter-spacing:inherit; } .fast th button.on { color:var(--accent); }
    .fast th:first-child, .fast td:first-child { text-align:left; }
    .fast td { text-align:right; padding:8px 3px; border-bottom:1px solid var(--line); font-family:var(--mono); cursor:pointer; }
    .fast tr:last-child td { border-bottom:0; } .fast td.lt span { margin-left:3px; font-weight:700; }
    .dotl { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--line); vertical-align:1px; }
    .dotl.go { background:var(--up); } .dotl.watch { background:var(--mid); }
    .pv { display:grid; gap:6px; padding:8px 0; } .pv p { margin:0; }
    .pvbar { position:relative; height:12px; border-radius:6px; background:var(--line); margin-top:6px; }
    .pvbar span { position:absolute; top:0; height:12px; }
    .pvbar .z1 { background:var(--up); opacity:.55; border-radius:6px 0 0 6px; } .pvbar .z2 { background:var(--upbg); }
    .pvbar .z3 { background:var(--midbg); } .pvbar .z4 { background:var(--downbg); border-radius:0 6px 6px 0; }
    .pvbar i { position:absolute; top:-5px; width:3px; height:22px; margin-left:-1px; background:var(--ink); border-radius:2px; }
    .pv .lab { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-family:var(--mono); }
    .rr { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 0; }
    .rr h5 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
    ul.plain { margin:0; padding-left:16px; font-size:13px; color:var(--ink2); display:grid; gap:4px; }
    .box ul.plain { padding-top:8px; padding-bottom:8px; }
    .chk { display:grid; grid-template-columns:22px 1fr auto; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); align-items:start; }
    .chk:last-child { border-bottom:0; } .chk .q { font-weight:600; font-size:14px; } .chk .a { font-size:12.5px; color:var(--muted); }
    .chk .v { font:600 12px var(--mono); text-align:right; max-width:9em; }
    .dot { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; }
    .dot.y { background:var(--upbg); color:var(--up); } .dot.n { background:var(--downbg); color:var(--down); } .dot.u { background:var(--midbg); color:var(--mid); }
    ul.ev { list-style:none; margin:0; padding:0; font-size:13px; }
    ul.ev li { padding:8px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:8px; }
    ul.ev li:last-child { border-bottom:0; } ul.ev a { font-weight:600; text-decoration:none; white-space:nowrap; }
    ul.ev .r { text-align:right; font-family:var(--mono); font-size:12px; }
    .stt { overflow-x:auto; padding:6px 0; }
    .stt table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
    .stt th { font-size:10px; color:var(--muted); text-align:right; padding:4px; } .stt th:first-child { text-align:left; }
    .stt td { text-align:right; padding:5px 4px; border-top:1px solid var(--line); font-family:var(--mono); vertical-align:bottom; white-space:nowrap; }
    .stt td:first-child { text-align:left; font-family:var(--sans); white-space:normal; }
    .stt td i { display:block; width:60%; margin:0 0 2px auto; background:var(--accent); opacity:.45; border-radius:2px; } .stt td i.neg { background:var(--down); }

    /* Tab bar */
    nav.tabs { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(5, 1fr);
               background:var(--paper); border-top:1px solid var(--line); padding:6px 0 calc(6px + env(safe-area-inset-bottom)); z-index:5; }
    nav.tabs button { display:grid; justify-items:center; gap:2px; font-size:11px; color:var(--muted); font-weight:600; position:relative; }
    nav.tabs button.on { color:var(--accent); }
    nav.tabs svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .badge { position:absolute; top:-2px; left:calc(50% + 6px); background:var(--alert); color:#fff; font-size:10px; border-radius:99px; padding:0 5px; min-width:16px; }
  </style>
</head>
<body>
  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2"/><path d="M7 9h7M7 12h7M7 15h4"/></svg>Today</button>
    <button data-tab="alerts"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts<span id="badge" class="badge hidden"></span></button>
    <button data-tab="ideas"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/><path d="M14 4l3 3 4-5"/></svg>Ideas</button>
    <button data-tab="reports"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9 12h7M9 15h7M9 18h4"/></svg>Reports</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </nav>

  <script src="config.js"></script>
  <script src="ideas.js"></script>
  <script src="app.js"></script>
</body>
</html>
